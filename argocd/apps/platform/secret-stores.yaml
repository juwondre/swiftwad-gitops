# Cluster-wide store backed by AWS Secrets Manager via the external-secrets
# IRSA role. Name matches what the app-template chart's ExternalSecret expects,
# so vendor app secrets reuse this store as services onboard.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Dex's GitHub OAuth credentials, delivered from Secrets Manager into the
# argocd namespace. The part-of label lets argocd-cm reference the keys as
# $argocd-dex-github:clientID / :clientSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-dex-github
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: argocd-dex-github
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientID
      remoteRef:
        key: argocd/dex-github
        property: clientID
    - secretKey: clientSecret
      remoteRef:
        key: argocd/dex-github
        property: clientSecret
