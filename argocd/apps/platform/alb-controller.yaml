apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 1.13.0
    helm:
      valuesObject:
        clusterName: swiftwad-staging
        region: us-east-1
        vpcId: vpc-0e43ed93ae2862fc9
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::905418331655:role/alb-controller-swiftwad-staging
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
