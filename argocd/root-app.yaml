# App-of-apps: applied once by hand at bootstrap, then ArgoCD manages
# everything under argocd/ (including this file) from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juwondre/swiftwad-gitops
    targetRevision: main
    path: argocd
    directory:
      recurse: true
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
