apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: sample-api
  namespace: sample-api-delivery
spec:
  # Poll ECR every 30s so vendor pushes surface in dev within a minute.
  # (ECR has no native webhooks; for true push-based discovery, wire
  # EventBridge ECR events to Kargo's external webhook server via a public
  # endpoint — documented in swiftwad-infra/docs/PLATFORM-SETUP.md.)
  interval: 30s
  subscriptions:
    - image:
        repoURL: 905418331655.dkr.ecr.us-east-1.amazonaws.com/sample-api
        # Tags are git SHAs, not semver — pick by image build time.
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
